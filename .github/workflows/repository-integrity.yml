name: Repository integrity

on:
  pull_request:
    paths:
      - "schema/**"
      - "examples/**"
      - "tests/equivalence-100.json"
      - "tests/cases/**"
      - "tests/test_integrity.py"
      - "world_ir/integrity.py"
      - "world_ir/integrity_cli.py"
      - "pyproject.toml"
      - ".github/workflows/repository-integrity.yml"
  push:
    branches: [main]
    paths:
      - "schema/**"
      - "examples/**"
      - "tests/equivalence-100.json"
      - "tests/cases/**"
      - "tests/test_integrity.py"
      - "world_ir/integrity.py"
      - "world_ir/integrity_cli.py"
      - "pyproject.toml"
      - ".github/workflows/repository-integrity.yml"

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install integrity checker
        run: python -m pip install -e .
      - name: Test integrity checker failure modes
        run: python -m unittest tests.test_integrity -q
      - name: Check repository integrity
        run: world-ir-integrity --root .
