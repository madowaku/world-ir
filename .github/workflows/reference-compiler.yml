name: Reference compiler

on:
  pull_request:
    paths:
      - "world_ir/**"
      - "tests/test_*.py"
      - "examples/**"
      - "schema/world-ir-v0.1.schema.json"
      - "pyproject.toml"
      - ".github/workflows/reference-compiler.yml"
  push:
    branches: [main]
    paths:
      - "world_ir/**"
      - "tests/test_*.py"
      - "examples/**"
      - "schema/world-ir-v0.1.schema.json"
      - "pyproject.toml"
      - ".github/workflows/reference-compiler.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install reference compiler
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
