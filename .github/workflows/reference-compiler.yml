name: Reference compiler

on:
  pull_request:
    paths:
      - "world_ir/**"
      - "tests/test_*.py"
      - "tests/equivalence-100.json"
      - "tests/cases/**"
      - "examples/**"
      - "schema/world-ir-v0.1.schema.json"
      - "pyproject.toml"
      - ".github/workflows/reference-compiler.yml"
  push:
    branches: [main]
    paths:
      - "world_ir/**"
      - "tests/test_*.py"
      - "tests/equivalence-100.json"
      - "tests/cases/**"
      - "examples/**"
      - "schema/world-ir-v0.1.schema.json"
      - "pyproject.toml"
      - ".github/workflows/reference-compiler.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install reference compiler
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run 100-case seed evaluator
        run: |
          world-ir-eval --json > /tmp/world-ir-eval.json
          python -c "import json; r=json.load(open('/tmp/world-ir-eval.json', encoding='utf-8')); assert r['summary']['case_count'] == 100; assert r['summary']['false_equivalence']['count'] == 0"
